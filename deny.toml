# cargo-deny policy: licences, advisories, duplicate versions, crate sources.
# Run locally with `cargo deny check` (CI runs it on every PR).
#
# Leoht is MIT-licensed, so we only allow permissive licences by default.
# Copyleft (GPL/LGPL/AGPL) crates need an ADR and a deliberate entry here, e.g.
# `rawloader` and `rawler` are LGPL-2.1 and `heic` (imazen) is AGPL-3.0: see ADR-0004.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Apply the same licence policy to dev/test/bench-only dependencies (off by default).
include-dev = true
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0", # Boost: permissive (xxhash-rust, via criterion/rusqlite deps)
]

[bans]
multiple-versions = "warn" # tighten to "deny" once the dependency tree settles (Phase 1)
wildcards = "deny"
allow-wildcard-paths = true # path dependencies between workspace crates
# FR-FND-08: no networking or telemetry in any build. These crates must not
# appear anywhere in the dependency tree; a future opt-in network feature
# needs an ADR and an explicit, reviewed exception here.
deny = [
    # HTTP clients and servers
    { crate = "reqwest", reason = "FR-FND-08: no network access" },
    { crate = "hyper", reason = "FR-FND-08: no network access" },
    { crate = "h2", reason = "FR-FND-08: no network access" },
    { crate = "ureq", reason = "FR-FND-08: no network access" },
    { crate = "curl", reason = "FR-FND-08: no network access" },
    { crate = "curl-sys", reason = "FR-FND-08: no network access" },
    { crate = "isahc", reason = "FR-FND-08: no network access" },
    { crate = "attohttpc", reason = "FR-FND-08: no network access" },
    { crate = "surf", reason = "FR-FND-08: no network access" },
    { crate = "awc", reason = "FR-FND-08: no network access" },
    { crate = "tungstenite", reason = "FR-FND-08: no network access" },
    # TLS stacks (only useful for talking to a network)
    { crate = "rustls", reason = "FR-FND-08: no network access" },
    { crate = "native-tls", reason = "FR-FND-08: no network access" },
    { crate = "openssl", reason = "FR-FND-08: no network access" },
    { crate = "openssl-sys", reason = "FR-FND-08: no network access" },
    # Telemetry, crash reporting and analytics
    { crate = "sentry", reason = "FR-FND-08: no telemetry" },
    { crate = "opentelemetry", reason = "FR-FND-08: no telemetry" },
    { crate = "opentelemetry-otlp", reason = "FR-FND-08: no telemetry" },
    { crate = "tracing-opentelemetry", reason = "FR-FND-08: no telemetry" },
    { crate = "posthog-rs", reason = "FR-FND-08: no telemetry" },
    { crate = "segment", reason = "FR-FND-08: no telemetry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
