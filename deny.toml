# cargo-deny policy: licences, advisories, duplicate versions, crate sources.
# Run locally with `cargo deny check` (CI runs it on every PR).
#
# Leoht is MIT-licensed, so we only allow permissive licences by default.
# Copyleft (GPL/LGPL/AGPL) crates need an ADR and a deliberate entry here, e.g.
# `rawloader` and `rawler` are LGPL-2.1 and `heic` (imazen) is AGPL-3.0: see ADR-0004.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Apply the same licence policy to dev/test/bench-only dependencies (off by default).
include-dev = true
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0", # Boost: permissive (xxhash-rust, via criterion/rusqlite deps)
]

[bans]
multiple-versions = "warn" # tighten to "deny" once the dependency tree settles (Phase 1)
wildcards = "deny"
allow-wildcard-paths = true # path dependencies between workspace crates

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
