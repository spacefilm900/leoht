# Workspace-level integration, golden-image and volume tests.
# These live in their own package so they can depend on *every* crate and
# exercise them together, the way a front-end would.
[package]
name = "leoht-it"
description = "Cross-crate integration, golden-image and volume tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
# Test files sit directly in this folder rather than in a nested tests/ dir.
autotests = false

[[test]]
name = "end_to_end"
path = "end_to_end.rs"

[[test]]
name = "golden"
path = "golden.rs"

[[test]]
name = "volume"
path = "volume.rs"

[[test]]
name = "scan_corpus"
path = "scan_corpus.rs"

[[test]]
name = "library_rules"
path = "library_rules.rs"

[[test]]
name = "originals"
path = "originals.rs"

[[test]]
name = "unicode_paths"
path = "unicode_paths.rs"

[dev-dependencies]
leoht-core.workspace = true
leoht-catalog.workspace = true
leoht-scan.workspace = true
leoht-edit.workspace = true
leoht-thumb.workspace = true
leoht-library.workspace = true
leoht-testkit.workspace = true
blake3.workspace = true
camino.workspace = true
image.workspace = true
insta.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
