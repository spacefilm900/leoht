[package]
name = "leoht-scan"
description = "Folder walking, format detection, metadata probing, content hashing and (optionally) fs watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Live filesystem watching. Off by default: heavier dependency tree, platform
# backends (FSEvents on macOS, inotify on Linux). Phase 1 turns this on.
watch = ["dep:notify"]

[dependencies]
leoht-core.workspace = true
blake3.workspace = true
camino.workspace = true
ignore.workspace = true
image.workspace = true
kamadak-exif.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
notify = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
leoht-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "scan"
harness = false

[lints]
workspace = true
